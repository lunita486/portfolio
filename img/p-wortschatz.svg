<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="n1" cx="85%" cy="0%" r="70%"><stop offset="0" stop-color="#3A1068"/><stop offset="1" stop-color="#3A1068" stop-opacity="0"/></radialGradient>
    <radialGradient id="n2" cx="0%" cy="45%" r="60%"><stop offset="0" stop-color="#0E3A6B"/><stop offset="1" stop-color="#0E3A6B" stop-opacity="0"/></radialGradient>
    <radialGradient id="n3" cx="60%" cy="110%" r="60%"><stop offset="0" stop-color="#5A0F4F"/><stop offset="1" stop-color="#5A0F4F" stop-opacity="0"/></radialGradient>
    <radialGradient id="pl" cx="32%" cy="30%" r="75%"><stop offset="0" stop-color="#FFD36E"/><stop offset=".45" stop-color="#FF6FB5"/><stop offset="1" stop-color="#7A2BD6"/></radialGradient>
    <radialGradient id="pl2" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#A8FFF0"/><stop offset=".5" stop-color="#3BC8FF"/><stop offset="1" stop-color="#2B3FB8"/></radialGradient>
    <linearGradient id="tt" x1="0" x2="1"><stop offset="0" stop-color="#FFC24F"/><stop offset=".45" stop-color="#FF4FD8"/><stop offset="1" stop-color="#5CE1FF"/></linearGradient>
    <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#5CE1FF"/><stop offset="1" stop-color="#FF4FD8"/></linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="#0B0620"/>
  <rect width="1600" height="1000" fill="url(#n1)"/><rect width="1600" height="1000" fill="url(#n2)"/><rect width="1600" height="1000" fill="url(#n3)"/>
  <g fill="#fff" opacity=".8">
    <circle cx="120" cy="90" r="2"/><circle cx="380" cy="160" r="1.5"/><circle cx="700" cy="60" r="2"/><circle cx="1010" cy="140" r="1.4"/>
    <circle cx="1480" cy="420" r="1.8"/><circle cx="240" cy="520" r="1.5"/><circle cx="90" cy="860" r="2"/><circle cx="560" cy="940" r="1.4"/>
    <circle cx="1290" cy="900" r="2"/><circle cx="1530" cy="760" r="1.5"/><circle cx="860" cy="30" r="1.3"/><circle cx="40" cy="330" r="1.6"/>
  </g>
  <circle cx="1440" cy="210" r="150" fill="url(#pl)"/>
  <ellipse cx="1440" cy="225" rx="270" ry="40" fill="none" stroke="#FFDC96" stroke-opacity=".55" stroke-width="5" transform="rotate(-14 1440 225)"/>
  <circle cx="70" cy="640" r="70" fill="url(#pl2)"/>

  <text x="120" y="175" font-size="92" font-weight="800" fill="url(#tt)">Wortschatz</text>
  <text x="124" y="225" font-size="30" fill="#BFB2E6">tu galaxia de palabras</text>

  <g font-size="22" fill="#BFB2E6">
    <rect x="120" y="265" width="210" height="96" rx="16" fill="#1E1240" fill-opacity=".8" stroke="#BEA0FF" stroke-opacity=".3"/>
    <text x="142" y="306" font-size="34" font-weight="700" fill="#F4EEFF">6/6</text><text x="142" y="340">META DE HOY</text>
    <rect x="350" y="265" width="210" height="96" rx="16" fill="#1E1240" fill-opacity=".8" stroke="#BEA0FF" stroke-opacity=".3"/>
    <text x="372" y="306" font-size="34" font-weight="700" fill="#F4EEFF">7</text><text x="372" y="340">RACHA</text>
    <rect x="580" y="265" width="210" height="96" rx="16" fill="#1E1240" fill-opacity=".8" stroke="#BEA0FF" stroke-opacity=".3"/>
    <text x="602" y="306" font-size="34" font-weight="700" fill="#F4EEFF">12</text><text x="602" y="340">DOMINADAS</text>
  </g>

  <rect x="120" y="395" width="1120" height="560" rx="26" fill="#1E1240" fill-opacity=".82" stroke="#BEA0FF" stroke-opacity=".3"/>
  <text x="160" y="450" font-size="22" font-weight="700" fill="#BFB2E6" letter-spacing="2">QUIZ · ABLEGEN · <tspan fill="#5CE1FF">COMPLETAR LA FRASE</tspan></text>
  <text x="160" y="500" font-size="32" font-weight="700" fill="#F4EEFF">¿Qué palabra completa la frase?</text>
  <rect x="160" y="525" width="1040" height="80" rx="16" fill="#3A2470" fill-opacity=".6" stroke="#BEA0FF" stroke-opacity=".3"/>
  <text x="188" y="577" font-size="32" fill="#F4EEFF">Morgen muss ich eine Prüfung <tspan fill="#FFC24F" font-weight="800">___</tspan> .</text>
  <g font-size="30" fill="#F4EEFF">
    <rect x="160" y="630" width="505" height="74" rx="14" fill="#46E68C" fill-opacity=".16" stroke="#6FF2A8" stroke-width="2.5"/><text x="190" y="678">ablegen</text>
    <rect x="695" y="630" width="505" height="74" rx="14" fill="#1E1240" stroke="#BEA0FF" stroke-opacity=".35" stroke-width="2"/><text x="725" y="678">abgelegt</text>
    <rect x="160" y="722" width="505" height="74" rx="14" fill="#1E1240" stroke="#BEA0FF" stroke-opacity=".35" stroke-width="2"/><text x="190" y="770">auflegen</text>
    <rect x="695" y="722" width="505" height="74" rx="14" fill="#1E1240" stroke="#BEA0FF" stroke-opacity=".35" stroke-width="2"/><text x="725" y="770">ablegt</text>
  </g>
  <rect x="160" y="822" width="1040" height="100" rx="16" fill="#46E68C" fill-opacity=".14"/>
  <rect x="160" y="822" width="6" height="100" fill="#6FF2A8"/>
  <text x="190" y="864" font-size="28" font-weight="700" fill="#6FF2A8">¡Correcto!</text>
  <text x="190" y="902" font-size="24" fill="#BFB2E6">Con el verbo modal „muss“ va el infinitivo al final: eine Prüfung ablegen.</text>
